<!DOCTYPE html>
<html>
<head>
<title>Horizontal Nav Menu</title>
<style>
    nav { display: flex; }
    nav a {
      display: block;
      padding: 10px 18px;
      border: 1px solid #333;
      background: #1f2937;
      color: #f9fafb;
      text-decoration: none;      /* remove underline */
      font-size: 14px;
    }
    nav a:hover {
      color: #facc15;             /* color change on hover */
      font-size: 16px;            /* size increase on hover */
      background: #374151;
    }
    nav a:visited { color: #f9fafb; }   /* override default purple visited color */
</style>
</head>
<body>
<nav>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Blog</a>
    <a href="#">Contact</a>
</nav>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
