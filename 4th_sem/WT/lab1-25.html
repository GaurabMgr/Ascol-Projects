<!DOCTYPE html>
<html>
<head><title>Website Layout (Nested Tables)</title></head>
<body>
<table border="1" width="100%" cellpadding="10">
  <tr>
    <td colspan="2">
      <img src="logo.png" alt="Logo" width="40" style="vertical-align:middle;"> <b>ABC Company</b>
    </td>
  </tr>
  <tr>
    <td colspan="2">
      <a href="#">Home</a> | <a href="#">About Us</a> | <a href="#">Contact Us</a>
    </td>
  </tr>
  <tr>
    <td width="50%">
      <table border="1" width="100%">
        <tr><td><b>Content 1</b></td></tr>
        <tr><td><b>News 1</b></td></tr>
      </table>
    </td>
    <td width="50%">
      <table border="1" width="100%">
        <tr><td><b>Content 2</b></td></tr>
        <tr><td><b>News 2</b></td></tr>
      </table>
    </td>
  </tr>
  <tr>
    <td colspan="2">
      &copy; ABC Company |
      <a href="#">Facebook</a>, <a href="#">Twitter</a> | Powered by ABC Hosting
    </td>
  </tr>
</table>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
