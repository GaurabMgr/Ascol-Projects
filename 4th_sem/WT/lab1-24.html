<!DOCTYPE html>
<html>
<head><title>Complex Spanning Table</title></head>
<body>
<table border="1" cellpadding="10" style="text-align:center;">
  <tr>
    <td>A</td><td>B</td><td>C</td><td rowspan="3">D</td>
  </tr>
  <tr>
    <td colspan="3">E</td>
  </tr>
  <tr>
    <td colspan="3">F / G</td>
  </tr>
  <tr>
    <td>H</td><td colspan="1"></td><td>J</td><td>K</td>
  </tr>
  <tr>
    <td></td><td></td><td>L</td><td>M</td>
  </tr>
</table>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
