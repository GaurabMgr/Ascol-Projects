<!DOCTYPE html>
<html>
<head><title>Nested Table with Rowspan/Colspan</title></head>
<body>
<table border="1" cellpadding="8">
    <tr>
      <th rowspan="2">Department</th>
      <th colspan="2">Semester Marks</th>
    </tr>
    <tr>
      <th>Theory</th>
      <th>Practical</th>
    </tr>
    <tr>
      <td>BIT</td>
      <td>
        <!-- nested table inside this cell -->
        <table border="1" cellpadding="4">
          <tr><td>Web Tech</td><td>72</td></tr>
          <tr><td>SAD</td><td>68</td></tr>
        </table>
      </td>
      <td>45</td>
    </tr>
</table>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
