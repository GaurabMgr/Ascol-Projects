<!DOCTYPE html>
<html>
<head>
<title>CSS Background Properties</title>
<style>
  body {
    background-image: url("bg.jpg");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;
    background-attachment: fixed;
    background-color: #00e1ff;  /* shows while the image loads, or behind transparency */
  }
</style>
</head>
<body>
  <h1 style="color:white;">Background Properties Demo</h1>
 <p>Name: Gaurab Ale Magar</p>
</body>
</html>
