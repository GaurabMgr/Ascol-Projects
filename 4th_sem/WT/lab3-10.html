<!DOCTYPE html>
<html>
<head>
<title>jQuery Animation</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>#box { width:80px; height:80px; background:tomato; position:relative; }</style>
</head>
<body>
<div id="box"></div>
<button id="animateBtn">Animate</button>
 
<script>
$(document).ready(function() {
        $("#animateBtn").click(function() {
          $("#box").animate({
            left: "250px",
            opacity: 0.5,
            height: "150px",
            width: "150px"
          }, 1500);
       });
});
</script>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
