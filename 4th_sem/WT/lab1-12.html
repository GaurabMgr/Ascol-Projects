<!-- CLIENT-SIDE IMAGE MAP: browser handles the click, no server request needed -->
<!DOCTYPE html>
<html>
<head><title>Client-Side Image Map</title></head>
<body>
  <img src="worldmap.jpg" alt="World Map" usemap="#worldmap" width="400" height="300">
  <map name="worldmap">
    <area shape="rect" coords="0,0,150,150" href="asia.html" alt="Asia">
    <area shape="rect" coords="150,0,300,150" href="europe.html" alt="Europe">
    <area shape="circle" coords="200,220,50" href="africa.html" alt="Africa">
  </map>
  <p>Name: Gaurab Ale Magar</p>
</body>
</html>
