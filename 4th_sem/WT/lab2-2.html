<!DOCTYPE html>
<html>
<head>
<title>Four Styled Paragraphs</title>
<style>
  p.intro   { font-size: 18px; font-weight: bold; color: darkblue; }
  p.body1   { font-family: Georgia, serif; line-height: 1.6; color: #333; }
  p.quote   { font-style: italic; color: gray; border-left: 3px solid #999; padding-left: 10px; }
  p.footer  { font-size: 12px; text-align: center; color: #888; }
</style>
</head>
<body>
  <p class="intro">Welcome to this styled demonstration page.</p>
  <p class="body1">This paragraph uses a serif font with comfortable line spacing to improve readability for longer passages of text.</p>
  <p class="quote">"Simplicity is the ultimate sophistication."</p>
  <p class="footer">&copy; 2026 Web Technology I Lab Report</p>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
