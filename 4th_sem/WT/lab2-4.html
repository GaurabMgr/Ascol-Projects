<!DOCTYPE html>
<html>
<head>
<title>Nested List - Internal CSS</title>
<style>
  ul { list-style-type: square; }
  ul ul { list-style-type: circle; margin-left: 20px; }
  ul ul ul { list-style-type: disc; }
  li { font-family: Arial; color: #444; margin: 4px 0; }
</style>
</head>
<body>
<ul>
    <li>Frontend
      <ul>
        <li>HTML</li>
        <li>CSS
          <ul>
            <li>Flexbox</li>
            <li>Grid</li>
          </ul>
        </li>
      </ul>
    </li>
    <li>Backend</li>
</ul>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
