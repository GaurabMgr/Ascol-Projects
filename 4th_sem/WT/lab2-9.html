<!DOCTYPE html>
<html>
<head>
<title>CSS Pseudo-element ::before</title>
<style>
  p.note::before {
    content: "NOTE: ";
    color: red;
    background-color: yellow;
    font-weight: bold;
    padding: 2px 4px;
  }
</style>
</head>
<body>
  <p class="note">Remember to submit your lab report before the deadline.</p>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
