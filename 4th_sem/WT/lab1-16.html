<!DOCTYPE html>
<html>
<head><title>10 Text Formatting Tags</title></head>
<body>
  <p><b>&lt;b&gt;</b> &rarr; <b>Bold text</b></p>
  <p><i>&lt;i&gt;</i> &rarr; <i>Italic text</i></p>
  <p><u>&lt;u&gt;</u> &rarr; <u>Underlined text</u></p>
  <p><mark>&lt;mark&gt;</mark> &rarr; <mark>Highlighted text</mark></p>
  <p><del>&lt;del&gt;</del> &rarr; <del>Deleted text</del></p>
  <p><ins>&lt;ins&gt;</ins> &rarr; <ins>Inserted text</ins></p>
  <p>&lt;sub&gt; &rarr; H<sub>2</sub>O</p>
  <p>&lt;sup&gt; &rarr; x<sup>2</sup></p>
  <p><small>&lt;small&gt;</small> &rarr; <small>Smaller text</small></p>
  <p><strong>&lt;strong&gt;</strong> &rarr; <strong>Important text</strong></p>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
