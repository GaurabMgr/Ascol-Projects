<!DOCTYPE html>
<html>
<head>
<title>jQuery Effects</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<img id="pic" src="bg.jpg" width="200">
<br>
<button id="hideBtn">Hide</button>
<button id="showBtn">Show</button>
<button id="fadeBtn">Fade Out</button>
<button id="stopBtn">Stop</button>
 
<script>
$(document).ready(function() {
        $("#hideBtn").click(function() { $("#pic").hide(1000); });
        $("#showBtn").click(function() { $("#pic").show(1000); });
        $("#fadeBtn").click(function() { $("#pic").fadeOut(3000); });
  $("#stopBtn").click(function() { $("#pic").stop(); });
});
</script>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
