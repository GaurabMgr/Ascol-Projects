<!DOCTYPE html>
<html>
<head><title>Align / Vspace / Hspace Demo</title></head>
<body>
  <h2>Gallery with align, vspace and hspace</h2>
  <img src="mage1.png" alt="1" align="left" vspace="10" hspace="15" width="150">
  <img src="mage2.png" alt="2" align="left" vspace="10" hspace="15" width="150">
  <img src="mage3.png" alt="3" align="right" vspace="10" hspace="15" width="150">
  <img src="mage4.png" alt="4" align="right" vspace="10" hspace="15" width="150">
  <p>
    This paragraph of text wraps around the floated gallery images above, and the
    vspace/hspace attributes add visible vertical and horizontal breathing room
    between each image and the text that surrounds it.
  </p>
  <img src="mage5.png" alt="5" align="left" vspace="10" hspace="15" width="150">
  <img src="mage6.png" alt="6" align="left" vspace="10" hspace="15" width="150">
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
