<!DOCTYPE html>
<html>
<head>
<title>Styled Class Table</title>
<style>
  table { border-collapse: collapse; }
  td {
    width: 150px; height: 60px; text-align: center;
    border: 3px solid #333;
  }
  .a { background: #fde68a; color: #7c2d12; text-transform: lowercase; }
  .b { background: #bbf7d0; color: #14532d; text-transform: lowercase; }
  .c { background: #bfdbfe; color: #1e3a8a; text-transform: uppercase; }
  .d { background: #fecaca; color: #7f1d1d; text-transform: uppercase; }
</style>
</head>
<body>
<table>
  <tr><td class="a">Class A</td><td class="b">Class B</td></tr>
  <tr><td class="c">Class C</td><td class="d">Class D</td></tr>
</table>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
