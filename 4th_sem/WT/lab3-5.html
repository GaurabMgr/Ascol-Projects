<!DOCTYPE html>
<html>
<head><title>Client-Side Validation</title></head>
<body>
<form onsubmit="return validateForm()">
  Name: <input type="text" id="name"><br>
  Age: <input type="text" id="age"><br>
  Phone: <input type="text" id="phone"><br>
  Email: <input type="text" id="email"><br>
  College:
  <select id="college">
    <option value="">--Select--</option>
    <option>Amrit Science Campus</option>
    <option>Patan Multiple Campus</option>
  </select><br>
  Gender:
  <input type="radio" name="gender" value="M"> Male
  <input type="radio" name="gender" value="F"> Female<br>
  <input type="checkbox" id="terms"> I accept all the terms<br>
  <input type="submit" value="Submit">
</form>
 
<script>
function validateForm() {
  var name = document.getElementById("name").value;
  var age = document.getElementById("age").value;
  var phone = document.getElementById("phone").value;
  var email = document.getElementById("email").value;
  var college = document.getElementById("college").value;
  var gender = document.querySelector('input[name="gender"]:checked');
  var terms = document.getElementById("terms").checked;
 
  if (!name || !age || !phone || !email || !college || !gender || !terms) {
    alert("All fields are required.");
    return false;
  }
  if (!/^[A-Za-z ]{7,}$/.test(name)) {
    alert("Name must contain only letters/spaces and be more than 6 characters.");
    return false;
  }
      if (!/^\d+$/.test(age) || age < 20 || age > 50) {
    alert("Age must be an integer between 20 and 50.");
    return false;
  }
      if (!/^(98|97)\d{8}$/.test(phone)) {
    alert("Phone must be exactly 10 digits and start with 98 or 97.");
    return false;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Please enter a valid email address.");
    return false;
  }
  alert("Form submitted successfully!");
  return true;
}
</script>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
