<!DOCTYPE html>
<html>
<head><title>Built-in Objects</title></head>
<body>
<script>
  // Array methods
  var fruits = ["Mango", "Apple", "Banana"];
  fruits.push("Orange");
  document.write("Array: " + fruits.join(", ") + "<br>");
 
  // Date methods
  var today = new Date();
  document.write("Date: " + today.getDate() + "/" + (today.getMonth()+1) + "/" + today.getFullYear() + "<br>");
 
  // String methods
  var text = "Web Technology";
  document.write("String: " + text.toUpperCase() + " has length " + text.length + "<br>");
 
  // Math methods
  document.write("Math: sqrt(49)=" + Math.sqrt(49) + ", round(4.7)=" + Math.round(4.7));
</script>
<p>Name: Gaurab Ale Magar</p>
</body>
</html>
